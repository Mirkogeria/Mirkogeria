name: Aggiorna le card del README

on:
  schedule:
    - cron: "17 5 * * *" # ogni mattina alle 5:17 UTC
  workflow_dispatch: # pulsante "Run workflow" nella tab Actions
  push:
    branches: [main]
    paths: ["scripts/**", "profile.json", "assets/**"]

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica i contributi
        env:
          # PROFILE_TOKEN e facoltativo: senza, si usa il token automatico della Action
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python3 scripts/fetch_contributions.py

      - name: Disegna le card (hero, grafico, statistiche, tile, progetti)
        run: python3 scripts/render_readme_cards.py

      - name: Committa se qualcosa e cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "Aggiorna le card del README"
          git push
